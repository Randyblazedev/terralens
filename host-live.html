<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go live — TerraLens</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="src/styles/tailwind.css">
<link rel="stylesheet" href="src/styles/app.css">
<script src="src/js/runtime-config.js"></script>
<script type="module" src="src/js/supabase.js"></script>
</head>
<body class="bg-[#06080b] text-white">
  <header class="tl-nav sticky top-0 z-50"><div class="tl-shell flex h-16 items-center justify-between">
    <a href="index.html" class="flex items-center gap-3"><img src="assets/terralens-mark.png" class="tl-logo" alt=""><span class="font-display text-lg font-extrabold">Terra<span class="text-sky-300">Lens</span></span></a>
    <a href="live.html" class="tl-btn tl-btn-ghost !min-h-10">← Live</a>
  </div></header>
  <main class="tl-section"><div class="tl-shell max-w-4xl">
    <p class="tl-eyebrow">Creator studio</p><h1 class="mt-2 text-3xl font-extrabold">Go live</h1>
    <p class="mt-2 text-white/55">Broadcasting needs camera and microphone permission. Nothing is sent until you press Start.</p>
    <div id="gate" class="tl-card p-6 mt-6 hidden"><p class="font-bold text-lg">Host access required</p><p class="mt-2 text-sm text-white/55">Only verified hosts, businesses and admins can go live.</p></div>
    <div id="panel" class="hidden">
      <div class="tl-card p-6 mt-6 grid gap-3">
        <label class="text-sm">Title <input id="title" maxlength="140" class="tl-input" placeholder="Sunset at the falls"></label>
        <label class="text-sm">Summary <input id="summary" maxlength="300" class="tl-input" placeholder="What people will see"></label>
        <div class="grid gap-3 sm:grid-cols-2">
          <label class="text-sm">Category <select id="cat" class="tl-input"><option value="nature">Nature</option><option value="culture">Culture</option><option value="food">Food</option><option value="beach">Beach</option><option value="city">City</option></select></label>
          <label class="text-sm">Place ID (optional) <input id="place" class="tl-input" placeholder="uuid"></label>
        </div>
        <button id="create" class="tl-btn tl-btn-primary">Create broadcast</button>
      </div>
      <div id="studio" class="tl-card p-6 mt-5 hidden">
        <h2 class="text-xl font-bold">Your broadcast</h2>
        <video id="preview" class="mt-4 w-full rounded-xl bg-black" autoplay muted playsinline style="aspect-ratio:16/9"></video>
        <div class="mt-4 flex flex-wrap gap-2"><button id="start" class="tl-btn tl-btn-accent">Start streaming</button><button id="stop" class="tl-btn tl-btn-ghost" disabled>Stop</button><a id="watch" href="#" class="tl-btn tl-btn-ghost">View room</a></div>
        <div id="requests" class="mt-5"><h3 class="font-bold">Join requests</h3><div id="req-list" class="mt-2 grid gap-2"></div></div>
        <p id="msg" class="mt-3 text-sm text-sky-300"></p>
      </div>
    </div>
  </div></main>
  <script type="module">
    import {supabase} from "./src/js/supabase.js";
    import {initNav,escapeHtml,backFab} from "./src/js/app.js";
    await initNav();
    document.body.insertAdjacentHTML("beforeend",backFab("live.html"));
    const gate=document.getElementById("gate"),panel=document.getElementById("panel"),msg=document.getElementById("msg");
    const {data:{session}}=await supabase.auth.getSession();
    if(!session){location.href="login.html?next=host-live.html";}
    else{
      const cfg=await (await fetch("/api/live?action=config")).json();
      if(!cfg.configured){gate.classList.remove("hidden");gate.querySelector("p:last-child").textContent="Live is not configured. Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_STREAM_TOKEN in Vercel.";}
      else if(!cfg.canHost){gate.classList.remove("hidden");}
      else{
        panel.classList.remove("hidden");
        let pc=null,stream=null,broadcastId=null;
        const post=async(action,body={})=>{const r=await fetch("/api/live?action="+action,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token},body:JSON.stringify(body)});return r.json().catch(()=>({}))};
        async function loadRequests(){if(!broadcastId)return;const r=await fetch("/api/live?action=requests&id="+encodeURIComponent(broadcastId),{headers:{Authorization:"Bearer "+session.access_token}});const d=await r.json().catch(()=>({}));document.getElementById("req-list").innerHTML=(d.requests||[]).map(x=>`<div class="tl-card p-3 flex items-center justify-between gap-3"><span class="text-sm">${escapeHtml(x.profiles?.display_name||x.profiles?.username||'Viewer')} · ${escapeHtml(x.status)}</span><span class="flex gap-2"><button class="tl-btn tl-btn-ghost !min-h-8" data-rid="${x.id}" data-status="approved">Approve</button><button class="tl-btn tl-btn-ghost !min-h-8" data-rid="${x.id}" data-status="declined">Decline</button></span></div>`).join("")||'<p class="text-sm text-white/45">No requests yet.</p>'}
        document.getElementById("req-list").addEventListener("click",async e=>{const b=e.target.closest("[data-rid]");if(!b)return;await post("decide",{id:b.dataset.rid,status:b.dataset.status});loadRequests();});
        document.getElementById("create").onclick=async()=>{
          msg.textContent="Creating broadcast…";
          const title=document.getElementById("title").value.trim();
          if(title.length<4){msg.textContent="Add a title first.";return}
          const place=document.getElementById("place").value.trim();
          const r=await post("create",{title,summary:document.getElementById("summary").value.trim(),category:document.getElementById("cat").value,place_id:/^[0-9a-f-]{36}$/i.test(place)?place:null});
          if(r.error){msg.textContent=r.error;return}
          broadcastId=r.id;
          window.__whip=r.whipUrl;
          document.getElementById("studio").classList.remove("hidden");
          document.getElementById("watch").href="watch-live.html?id="+encodeURIComponent(r.id);
          msg.textContent="Broadcast created. Grant camera access, then press Start streaming.";
          loadRequests();setInterval(loadRequests,5000);
        };
        document.getElementById("start").onclick=async()=>{
          msg.textContent="Requesting camera and microphone…";
          try{
            stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
          }catch{msg.textContent="Camera or microphone permission was denied.";return}
          document.getElementById("preview").srcObject=stream;
          pc=new RTCPeerConnection({bundlePolicy:"max-bundle"});
          stream.getTracks().forEach(t=>pc.addTrack(t,stream));
          const offer=await pc.createOffer();await pc.setLocalDescription(offer);
          const resp=await fetch(window.__whip,{method:"POST",headers:{"Content-Type":"application/sdp"},body:pc.localDescription.sdp});
          if(!resp.ok){msg.textContent="Streaming provider rejected the connection ("+resp.status+").";return}
          await pc.setRemoteDescription({type:"answer",sdp:await resp.text()});
          await post("start",{id:broadcastId});
          document.getElementById("start").disabled=true;document.getElementById("stop").disabled=false;
          msg.textContent="You are live.";
        };
        document.getElementById("stop").onclick=async()=>{
          if(pc)pc.close();if(stream)stream.getTracks().forEach(t=>t.stop());
          document.getElementById("preview").srcObject=null;
          await post("end",{id:broadcastId});
          document.getElementById("start").disabled=false;document.getElementById("stop").disabled=true;
          msg.textContent="Broadcast ended.";
        };
      }
    }
  </script>
</body>
</html>
