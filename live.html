<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live — TerraLens</title>
<meta name="description" content="Watch real people explore places around the world, live.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="src/styles/tailwind.css">
<link rel="stylesheet" href="src/styles/app.css">
<script src="src/js/runtime-config.js"></script>
<script type="module" src="src/js/supabase.js"></script>
<style>
.live-card{background:#0d1422;border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden}
.live-dot{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#fca5a5;text-transform:uppercase;letter-spacing:.1em}
.live-dot i{width:7px;height:7px;border-radius:50%;background:#ef4444;display:inline-block}
</style>
<link rel="canonical" href="https://www.terralensapp.com/live.html">
<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1">
<meta property="og:url" content="https://www.terralensapp.com/live.html">
<meta property="og:site_name" content="TerraLens">
<meta property="og:locale" content="en_US">
<meta name="twitter:title" content="Live — TerraLens">
<meta name="twitter:description" content="Watch real people explore places around the world, live.">
</head>
<body class="bg-[#06080b] text-white">
  <header class="tl-nav sticky top-0 z-50"><div class="tl-shell flex h-16 items-center justify-between">
    <a href="index.html" class="flex items-center gap-3"><img src="assets/terralens-mark.png" class="tl-logo" alt=""><span class="font-display text-lg font-extrabold">Terra<span class="text-sky-300">Lens</span></span></a>
    <div class="flex items-center gap-2"><a href="host-live.html" id="host-link" class="tl-btn tl-btn-ghost !min-h-10 hidden">Go live</a></div>
  </div></header>
  <main class="tl-section"><div class="tl-shell">
    <p class="tl-eyebrow">TerraLens Live</p>
    <h1 class="mt-2 text-4xl font-extrabold">Experience a place <span class="text-sky-300">right now.</span></h1>
    <p class="mt-3 max-w-2xl text-white/55">Real broadcasts from hosts around the world. No recordings pretending to be live — viewer counts come straight from the streaming provider.</p>
    <div id="list" class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    <p id="msg" class="mt-5 text-sm text-white/50"></p>
  </div></main>
  <script type="module">
    import {supabase} from "./src/js/supabase.js";
    import {initNav,escapeHtml,backFab} from "./src/js/app.js";
    await initNav();
    document.body.insertAdjacentHTML("beforeend",backFab("index.html"));
    const list=document.getElementById("list"),msg=document.getElementById("msg");
    list.innerHTML='<div class="tl-card p-6 animate-pulse">Checking for live broadcasts…</div>';
    const r=await fetch("/api/live?action=list");const d=await r.json().catch(()=>({}));
    if(!r.ok){list.innerHTML="";msg.textContent=d.error||"Live is unavailable right now.";}
    else{
      const rows=d.broadcasts||[];
      list.innerHTML=rows.length?rows.map(b=>`<a href="watch-live.html?id=${encodeURIComponent(b.id)}" class="live-card">
        <div class="p-5"><span class="${b.status==='live'?'live-dot':'text-xs text-white/45'}">${b.status==='live'?'<i></i> Live now':'Scheduled'}</span>
        <h2 class="mt-3 text-lg font-bold">${escapeHtml(b.title)}</h2>
        <p class="mt-1 line-clamp-2 text-sm text-white/55">${escapeHtml(b.summary)}</p>
        <p class="mt-3 text-xs text-white/45">${escapeHtml(b.host_name)}${b.place_name?' · '+escapeHtml(b.place_name+(b.place_country?', '+b.place_country:'')):''}</p></div></a>`).join(""):"";
      if(!rows.length)msg.innerHTML='No one is live right now. <a href="host-live.html" class="text-sky-300">Start the first broadcast</a> if you are an approved host.';
    }
    try{
      const c=await (await fetch("/api/live?action=config")).json();
      if(c.canHost)document.getElementById("host-link").classList.remove("hidden");
      if(!c.configured)msg.textContent="Live needs Cloudflare Stream credentials. See the setup note for CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_STREAM_TOKEN.";
    }catch{}
  </script>
</body>
</html>
