<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask a Local — TerraLens</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="src/styles/tailwind.css">
<link rel="stylesheet" href="src/styles/app.css">
<link rel="stylesheet" href="assets/css/new-features.css?v=20261124">
<script src="src/js/runtime-config.js"></script>
<script type="module" src="src/js/supabase.js"></script>
<link rel="canonical" href="https://www.terralensapp.com/ask-local.html">
<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1">
<meta property="og:url" content="https://www.terralensapp.com/ask-local.html">
<meta property="og:site_name" content="TerraLens">
<meta property="og:locale" content="en_US">
<meta name="twitter:title" content="Ask a Local — TerraLens">
</head>
<body class="bg-[#06080b] text-white">
  <header class="tl-nav sticky top-0 z-50"><div class="tl-shell flex h-16 items-center justify-between">
    <a href="index.html" class="flex items-center gap-3"><img src="assets/terralens-mark.png" class="tl-logo" alt=""><span class="font-display text-lg font-extrabold">Terra<span class="text-sky-300">Lens</span></span></a>
    <a href="moments.html" class="tl-btn tl-btn-ghost !min-h-10">← Moments</a>
  </div></header>
  <main class="tl-section"><div class="tl-shell max-w-3xl">
    <p class="tl-eyebrow">Community</p><h1 class="mt-2 text-3xl font-extrabold">Ask a Local</h1>
    <p class="mt-2 text-white/55">Ask a question about a real place. Anyone who knows can answer.</p>
    <section id="real-place-examples" class="mt-6">
  <p class="tl-eyebrow">Start with a real place</p>
  <h2 class="mt-2 text-lg font-bold">Examples from the TerraLens map</h2>
  <div id="example-places" class="mt-3 grid gap-2 sm:grid-cols-3"></div>
</section>
<div class="tl-card p-5 mt-6">
      <h2 class="text-lg font-bold">Ask a question</h2>
      <div class="mt-3 grid gap-3">
        <label class="text-sm">Place <select id="place" class="tl-input"><option value="">Choose a place</option></select></label>
        <label class="text-sm">Question <textarea id="q" maxlength="500" class="tl-input !min-h-20" placeholder="What's the best time to go?"></textarea></label>
        <button id="ask" class="tl-btn tl-btn-primary">Post question</button>
      </div>
      <p id="msg" class="mt-2 text-sm text-sky-300"></p>
    </div>
    <div id="list" class="mt-6 grid gap-4"></div>
  </div></main>
  <script type="module">
import {supabase} from "./src/js/supabase.js";
import {initNav,escapeHtml,backFab,imgSize} from "./src/js/app.js";
(async()=>{


    await initNav();
    document.body.insertAdjacentHTML("beforeend",backFab("community.html"));
    const list=document.getElementById("list"),msg=document.getElementById("msg");
    const {data:{session}}=await supabase.auth.getSession();
    const {data:places}=await supabase.from("places").select("id,name,country").eq("status","published").order("name").limit(300);
    const placeOpts='<option value="">Choose a place</option>'+(places||[]).map(p=>`<option value="${p.id}">${escapeHtml(p.name)}${p.country?', '+escapeHtml(p.country):''}</option>`).join("");
    const preset=new URLSearchParams(location.search).get("place")||"";
    document.getElementById("place").innerHTML=placeOpts.replace(`value="${preset}"`,`value="${preset}" selected`);
    document.getElementById("ask").onclick=async()=>{
      if(!session){msg.textContent="Sign in to ask.";return}
      const place=document.getElementById("place").value,q=document.getElementById("q").value.trim();
      if(!place||q.length<5){msg.textContent="Choose a place and write a longer question.";return}
      const {error}=await supabase.from("local_questions").insert({user_id:session.user.id,place_id:place,question:q});
      msg.textContent=error?error.message:"Question posted.";if(!error)location.reload();
    };
    const {data:qs,error}=await supabase.from("local_questions").select("id,question,created_at,user_id,profiles!local_questions_user_id_fkey(display_name,username),places!local_questions_place_id_fkey(id,name,country)").order("created_at",{ascending:false}).limit(40);
    if(error){list.innerHTML="";msg.textContent=error.message;return}
    if(!qs||!qs.length){list.innerHTML="";msg.textContent="No questions yet. Ask the first one.";return}
    list.innerHTML=qs.map(q=>`<article class="tl-card p-5">
      <p class="text-xs text-white/45">${escapeHtml(q.profiles?.display_name||q.profiles?.username||"Traveler")} · ${new Date(q.created_at).toLocaleDateString()} · ${escapeHtml(q.places?.name||"Place")}</p>
      <h2 class="mt-2 text-lg font-bold">${escapeHtml(q.question)}</h2>
      <div class="mt-3 grid gap-2" data-answers="${q.id}"></div>
      <div class="mt-3 flex gap-2"><input class="tl-input" maxlength="1000" placeholder="Your answer…" data-input="${q.id}"><button class="tl-btn tl-btn-ghost !min-h-10 answer" data-id="${q.id}">Answer</button></div>
    </article>`).join("");
    for(const q of qs){
      const {data:ans}=await supabase.from("local_answers").select("id,answer,created_at,profiles!local_answers_user_id_fkey(display_name,username)").eq("question_id",q.id).order("created_at").limit(20);
      const box=list.querySelector(`[data-answers="${q.id}"]`);
      if(box)box.innerHTML=(ans||[]).map(a=>`<div class="rounded-lg bg-white/5 p-3 text-sm"><b class="text-sky-300">${escapeHtml(a.profiles?.display_name||a.profiles?.username||"Local")}</b> ${escapeHtml(a.answer)}</div>`).join("")||'<p class="text-sm text-white/40">No answers yet.</p>';
    }
    list.querySelectorAll(".answer").forEach(b=>b.onclick=async()=>{
      if(!session){msg.textContent="Sign in to answer.";return}
      const input=list.querySelector(`[data-input="${b.dataset.id}"]`),answer=input.value.trim();
      if(answer.length<2){msg.textContent="Write an answer first.";return}
      const {error}=await supabase.from("local_answers").insert({question_id:b.dataset.id,user_id:session.user.id,answer});
      msg.textContent=error?error.message:"Answer posted.";if(!error)location.reload();
    });
  
    (async()=>{
      const {data:ex}=await supabase.from("places").select("id,name,country,cover_url").eq("status","published").not("cover_url","is",null).order("view_count",{ascending:false}).limit(3);
      const box=document.getElementById("example-places");
      if(box&&ex&&ex.length)box.innerHTML=ex.map(x=>`<a href="HREF_PLACEHOLDER${encodeURIComponent(x.id)}" class="tl-card p-3 flex items-center gap-3 hover:bg-white/5"><span class="w-12 h-12 rounded-lg bg-white/5 shrink-0" style="background-image:url('${escapeHtml(imgSize(x.cover_url,160))}');background-size:cover;background-position:center"></span><span class="text-sm font-semibold">${escapeHtml(x.name)}<span class="block text-xs text-white/45">${escapeHtml(x.country||"")}</span></span></a>`).join("").replaceAll("HREF_PLACEHOLDER","ask-local.html?place=");
    })();
})();</script>
</body>
</html>
